name: Neko Void - Build ISO

on:
  workflow_dispatch:
    inputs:
      iso:
        description: '¿Qué ISO quieres construir?'
        required: true
        type: choice
        default: all
        options:
          - all
          - i3
          - icewm
          - jwm
          - kde
          - kde-nvidia
          - labwc
          - labwc-musl
          - lxqt
          - mate
          - matelibre
          - musl
          - niri
          - niri-nvidia
          - nvidia
          - nvidia-kde
          - nvidia390
          - nvidia470
          - nvidia580
          - ryoku-h
          - ryoku-n
          - xfce
      bootloader:
        description: 'Bootloader de la ISO (grub = GRUB+isolinux, limine = Limine BIOS+UEFI)'
        type: choice
        options:
          - grub
          - limine
        default: grub
      upload_sourceforge:
        description: '¿Subir la ISO a SourceForge?'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: neko-build-${{ github.ref }}
  cancel-in-progress: true

env:
  XBPS_CACHE_DIR: ${{ github.workspace }}/.cache/xbps

jobs:
  build-iso:
    name: Build ISO (${{ matrix.iso }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        iso: ${{ fromJson(inputs.iso == 'all' && '["i3","icewm","jwm","kde","kde-nvidia","labwc","labwc-musl","lxqt","mate","matelibre","musl","niri","niri-nvidia","nvidia","nvidia-kde","nvidia390","nvidia470","nvidia580","ryoku-h","ryoku-n","xfce"]' || format('["{0}"]', inputs.iso)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ponytail: la cache guarda .xbps descargados; xbps solo baja lo nuevo.
      # La clave NO lleva hashFiles: si cambia la lista de paquetes, una clave
      # nueva invalida el cache entero y obliga a descargarlo todo de nuevo.
      - name: Restore xbps cache
        uses: actions/cache@v4
        with:
          path: ${{ env.XBPS_CACHE_DIR }}
          key: xbps-iso-v2
          restore-keys: xbps-iso-

      # ponytail: el build va en docker run y no en `container:` porque las
      # acciones JS del runner (checkout, cache) necesitan libstdc++ dentro
      # del contenedor, y la imagen de Void glibc no lo trae.
      - name: Check coherence
        run: sh tools/check-coherence.sh

      # El script del contenedor debe ser shell valido y no debe usar la forma
      # fragile con comillas simples (que trunca el script en silencio).
      - name: Check workflows
        run: sh tools/check-workflows.sh

      # Ratchet: shellcheck en los scripts de Neko (los de upstream no entran).
      # Se baja a -S info cuando llegue a 0 avisos.
      - name: Shellcheck
        run: |
          shellcheck -S warning \
            live-maker/neko-builder.sh \
            live-maker/neko-limine.sh \
            live-maker/flavor.sh \
            live-maker/xbps-install-musl.sh \
            live-maker/postsetup-nvidia.sh \
            tools/check-coherence.sh \
            tools/check-installer.sh

      # El instalador no lleva 'set -e' a proposito (upstream usa el codigo de
      # dialog y de grep como control de flujo). Este lint comprueba que todo
      # comando que escribe en el disco comprueba su exit code.
      - name: Check installer error handling
        run: sh tools/check-installer.sh

      # El wrapper de xbps-install no debe filtrar los repos musl cuando el
      # target es musl (mklive usa XBPS_ARCH en una llamada y solo
      # XBPS_TARGET_ARCH en la otra).
      - name: Test xbps wrapper
        run: sh tools/test-wrapper.sh

      - name: Build Neko-Void ISO (${{ matrix.iso }})
        env:
          DESKTOP: ${{ matrix.iso }}
          BOOT: ${{ inputs.bootloader }}
        run: |
          set -e
          docker run --rm --privileged --cap-add=FOWNER -i \
            -e DESKTOP="$DESKTOP" -e BOOT="$BOOT" \
            -v /dev:/dev -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/live-maker \
            ghcr.io/void-linux/void-glibc:20261001R1 sh -s <<'EOS'
          set -e
          export LANG=C.UTF-8
          # El cachedir vive en el workspace para que la cache persista.
          # Target y host comparten cache: los .xbps llevan la arch en el
          # nombre, asi que no colisionan.
          # ponytail: los mkdir no son opcionales: con la cache fria el
          # symlink queda colgando y xbps aborta con "[trans] failed to
          # change dir to cachedir ... No such file or directory".
          mkdir -p /workspace/.cache/xbps/target /workspace/.cache/xbps/host
          # El indice cacheado de un repo puede quedarse viejo (xbps no lo
          # resincroniza si el servidor responde 'not modified') y entonces un
          # paquete que ya existe sale como "Package 'jq' not found in
          # repository pool". Los .xbps (lo pesado, 1,8 GB) se conservan; solo
          # se borran los indices, que son unos MB.
          find /workspace/.cache/xbps -name '*repodata*' -delete 2>/dev/null || true
          ln -sfn /workspace/.cache/xbps/target xbps-cachedir-x86_64-musl
          ln -sfn /workspace/.cache/xbps/host xbps-cachedir-x86_64
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ bash coreutils sed tar gzip xz zstd gawk grep findutils diffutils util-linux e2fsprogs dosfstools kmod squashfs-tools shadow git sudo curl wget file python3 python3-pip rsync openssh

          groupadd -g 1000 anon
          useradd -m -u 1000 -g anon -s /bin/bash anon
          echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon

          cd /workspace/live-maker

          # ─── Politica del flavor: la misma que lee el builder ───
          OV=$(sh flavor.sh "$DESKTOP" overlay)
          DM=$(sh flavor.sh "$DESKTOP" dm)
          if [ -z "$OV" ]; then
            echo "Flavor desconocido: $DESKTOP" >&2
            exit 1
          fi

          # ─── Pasos especiales de cada flavor ───
          case "$DESKTOP" in
            xfce)
              rm -rf "$OV/etc/skel/.config" "$OV/home/anon/.config"
              # El config extra vive en HuggingFace; si no esta, se sigue con
              # el del overlay. ponytail: --timeout para no colgarse con un
              # servidor lento (wget sale con 8 en un 404 y tumbaba el build).
              if wget -q --timeout=15 --tries=2 \
                 https://huggingface.co/datasets/arepaconcafe/untested-neko/resolve/main/xfce.tar; then
                tar -xf xfce.tar -C "$OV/home/anon/"
                tar -xf xfce.tar -C "$OV/etc/skel/"
              else
                echo "aviso: no se pudo descargar xfce.tar; la ISO usa el config del overlay" >&2
              fi
              ;;
            nvidia*|kde-nvidia|niri-nvidia)
              # Ficheros de NVIDIA (grub defaults, dracut, modules-load): van
              # en el repo, no generados aqui (politica en datos).
              cp -rn nvidia/etc/. "$OV/etc/"
              ;;
          esac

          # La clave de z-repo-musl: la necesitan los flavors musl (segun el
          # arch del manifest, no segun el nombre del flavor).
          ARCH=$(sh flavor.sh "$DESKTOP" arch)
          case "$ARCH" in
            *-musl)
              mkdir -p /var/db/xbps/keys
              curl -sL https://srdicov.github.io/z-repo/keys/zlinux-repo.pub -o /var/db/xbps/keys/zlinux-repo.pub
              chmod 644 /var/db/xbps/keys/zlinux-repo.pub
              ;;
          esac

          # ─── Autologin: una sola fuente (live-maker/autologin) ───
          # Si el overlay trae su propia variante (xfce), esa gana.
          if echo "$DM" | grep -q lightdm; then
            mkdir -p "$OV/etc/pam.d"
            [ -f "$OV/etc/pam.d/lightdm-autologin" ] ||
              cp autologin/etc/pam.d/lightdm-autologin "$OV/etc/pam.d/"
          fi

          # ─── Pasos comunes a todos los flavors ───
          # ponytail: no se barrean los .conf a 644: git ya guarda los modos
          # y hay ficheros trackeados que son 755 a proposito. Si solo hace
          # falta el +x de los scripts, se da.
          find "$OV" -type d -exec chmod 755 {} \;
          find "$OV" -type f -name "run" -exec chmod +x {} \;
          find "$OV" -type f -name "*.sh" -exec chmod +x {} \;
          chown -R anon:anon "$OV"
          chmod 755 "$OV/home/anon"
          rm -f "$OV/home/anon/.Xauthority" "$OV/home/anon/.ICEauthority"

          # ponytail: los mirrors de Void se reindexan cada ~20 min y hay una
          # ventana en la que el indice y los ficheros no cuadran ("Package
          # 'jq' not found in repository pool" / "failed to download ...
          # signature"). Es infraestructura, no el build: reintenta.
          for attempt in 1 2 3; do
            if su anon -c "bash neko-builder.sh $DESKTOP -b '$BOOT'"; then
              break
            fi
            echo ">>> el build fallo (intento $attempt/3); reintento en 30 s" >&2
            [ "$attempt" -lt 3 ] || exit 1
            sleep 30
          done
          EOS
          # El ISO lo crea root; el runner (otro uid) tiene que poder escribir
          # ahi los checksums y los trozos del split.
          sudo chmod 777 "$GITHUB_WORKSPACE/live-maker"
          sudo chmod 644 "$GITHUB_WORKSPACE"/live-maker/*.iso 2>/dev/null || true

      - name: Generate Checksums
        run: |
          ISO_FILE=$(find "$GITHUB_WORKSPACE" -name "*.iso" | head -n 1)
          # ponytail: si el build no dejo ninguna ISO, esto tiene que fallar
          # aqui y decir por que. Si no, el error sale tres pasos despues
          # como "sha256sum: '': No such file or directory" y no senala la
          # causa (un contenedor que salio con 0 sin hacer nada).
          if [ -z "$ISO_FILE" ]; then
            echo "::error::No se ha generado ninguna ISO en $GITHUB_WORKSPACE" >&2
            ls -la "$GITHUB_WORKSPACE/live-maker" >&2
            exit 1
          fi
          if [ -n "$ISO_FILE" ]; then
            ISO_NAME=$(basename "$ISO_FILE")
            echo "ISO_FILE=$ISO_FILE" >> "$GITHUB_ENV"
            sha256sum "$ISO_FILE" > "${GITHUB_WORKSPACE}/${ISO_NAME}-sha256.txt"
            cat "${GITHUB_WORKSPACE}/${ISO_NAME}-sha256.txt"
          fi

      - name: Split ISO for release
        if: success()
        run: |
          # GitHub no acepta assets >=2GB: se publica partida
          split -b 1900M "$ISO_FILE" "$ISO_FILE-part-"
          (cd "$(dirname "$ISO_FILE")" && sha256sum "$(basename "$ISO_FILE")"-part-* > "$(basename "$ISO_FILE")"-part-sha256.txt)
          cat "$ISO_FILE-part-sha256.txt"

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.bootloader == 'limine' && 'iso-limine' || 'iso' }}
          name: Neko Void ISO (${{ matrix.iso }}, ${{ inputs.bootloader }})
          body: |
            ISO partida en trozos de 1900M. Para recomponer:
            `cat $(basename ${{ env.ISO_FILE }})-part-* > $(basename ${{ env.ISO_FILE }})`
            Verificar con `sha256sum -c`.
          files: |
            ${{ env.ISO_FILE }}-part-*
            ${{ env.ISO_FILE }}-part-sha256.txt

      - name: Upload ISO to Hugging Face
        # ponytail: el secret HF_TOKEN solo existe en el repo upstream; aqui
        # la subida no debe tumbar el build.
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DESKTOP: ${{ matrix.iso }}
        run: |
          python3 -m pip install -U "huggingface_hub[cli]" --break-system-packages
          ISO_FILE=$(find "$GITHUB_WORKSPACE" -name "*.iso" | head -n 1)
          ISO_NAME=$(basename "$ISO_FILE")
          SHA_FILE="$GITHUB_WORKSPACE/${ISO_NAME}-sha256.txt"

          case "$DESKTOP" in
            kde-nvidia|niri-nvidia) HF_NAME="nvidia580-$ISO_NAME" ;;
            nvidia390)              HF_NAME="390-nvidia-$ISO_NAME" ;;
            nvidia470)              HF_NAME="470-nvidia-$ISO_NAME" ;;
            nvidia580)              HF_NAME="580-nvidia-$ISO_NAME" ;;
            *)                      HF_NAME="$ISO_NAME" ;;
          esac

          hf upload arepaconcafe/untested-neko "$ISO_FILE" "$HF_NAME" --repo-type dataset --token $HF_TOKEN
          hf upload arepaconcafe/untested-neko "$SHA_FILE" "${ISO_NAME}-sha256.txt" --repo-type dataset --token $HF_TOKEN

      - name: Upload ISO to SourceForge
        if: ${{ inputs.upload_sourceforge }}
        env:
          SF_USER: ${{ secrets.SF_USER }}
          SF_PROJECT: ${{ secrets.SF_PROJECT }}
          SF_SSH_KEY_B64: ${{ secrets.SF_SSH_KEY_B64 }}
        run: |
          echo "$SF_SSH_KEY_B64" | base64 -d > /tmp/sf_key
          chmod 600 /tmp/sf_key

          mkdir -p /tmp/.ssh
          ssh-keyscan -H frs.sourceforge.net >> /tmp/.ssh/known_hosts

          ISO_FILE=$(find "$GITHUB_WORKSPACE" -name "*.iso" | head -n 1)

          if [ -n "$ISO_FILE" ]; then
            echo "Subiendo $ISO_FILE a SourceForge..."
            rsync -av --partial --timeout=120 -e "ssh -i /tmp/sf_key -o UserKnownHostsFile=/tmp/.ssh/known_hosts -o StrictHostKeyChecking=no" "$ISO_FILE" "${SF_USER}@frs.sourceforge.net:/home/frs/project/${SF_PROJECT}/isos/"
          else
            echo "Error: No se encontró ningún archivo ISO para subir a SourceForge."
            exit 1
          fi
