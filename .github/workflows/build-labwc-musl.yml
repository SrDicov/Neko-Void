name: Neko Void - LabWC MUSL

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neko-labwc-musl-${{ github.ref }}
  cancel-in-progress: true

env:
  XBPS_CACHE_DIR: ${{ github.workspace }}/.cache/xbps

jobs:
  build-labwc-musl:
    name: Build LabWC MUSL ISO
    runs-on: ubuntu-latest

    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ponytail: la cache guarda .xbps descargados; xbps solo baja lo nuevo/actualizado
      - name: Restore xbps cache
        uses: actions/cache@v4
        with:
          path: ${{ env.XBPS_CACHE_DIR }}
          key: xbps-labwc-musl-${{ hashFiles('live-maker/base-neko-pkgs.sh', 'live-maker/neko-builder.sh', 'live-maker/labwc-musl/**') }}
          restore-keys: xbps-labwc-musl-

      - name: Prepare container, users and key
        shell: sh
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -yu --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y --repository=https://repo-de.voidlinux.org/current/ git bash wget curl file sudo python3
          groupadd -g 1000 anon || true
          useradd -m -u 1000 -g anon -s /bin/bash anon || true
          echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon
          mkdir -p /var/db/xbps/keys
          curl -sL https://srdicov.github.io/z-repo/keys/zlinux-repo.pub -o /var/db/xbps/keys/zlinux-repo.pub
          chmod 644 /var/db/xbps/keys/zlinux-repo.pub

      - name: Diagnose repos (temporal)
        run: |
          cd "$GITHUB_WORKSPACE/live-maker"
          xbps-install --version || true
          ls keys/ | wc -l || true
          for u in "https://repo-ci.voidlinux.org/current/musl" "https://repo-ci.voidlinux.org/current/musl/nonfree" "https://github.com/SrDicov/z-repo-musl/releases/download/stable"; do
            curl -sSL -o /dev/null -w "repo $u -> http:%{http_code} %{size_download}B ip:%{remote_ip}\n" "$u/x86_64-musl-repodata" || true
          done
          curl -sSL -o /tmp/t.xbps -w "pkg http:%{http_code} %{size_download}B\n" "https://repo-ci.voidlinux.org/current/musl/xbps-triggers-0.131_1.x86_64-musl.xbps" || true
          curl -sSL -o /tmp/t.sig2 -w "sig http:%{http_code} %{size_download}B\n" "https://repo-ci.voidlinux.org/current/musl/xbps-triggers-0.131_1.x86_64-musl.xbps.sig2" || true
          sha256sum /tmp/t.xbps /tmp/t.sig2 || true
          true

      - name: Build LabWC MUSL ISO
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/live-maker"
          chmod 1777 /tmp
          chmod 1777 /var/tmp
          mkdir -p "$XBPS_CACHE_DIR/target" "$XBPS_CACHE_DIR/host"
          # El cachedir por defecto vive junto al builder; se enlaza al workspace para que la cache persista
          ln -sfn "$XBPS_CACHE_DIR/target" ./xbps-cachedir-x86_64-musl
          ln -sfn "$XBPS_CACHE_DIR/host" ./xbps-cachedir-x86_64
          mkdir -p labwc/etc/pam.d
          printf '#%%PAM-1.0\nauth required pam_env.so\nauth required pam_permit.so\naccount include system-login\npassword include system-login\nsession include system-login\n' > labwc/etc/pam.d/lightdm-autologin
          chmod 644 labwc/etc/pam.d/lightdm-autologin
          chown -R anon:anon "$GITHUB_WORKSPACE"
          chmod 755 ./labwc/home/anon
          rm -f ./labwc/home/anon/.Xauthority ./labwc/home/anon/.ICEauthority
          su anon -c "cd '$GITHUB_WORKSPACE/live-maker' && bash neko-builder.sh labwc-musl"
          # La cache la guarda el runner; necesita lectura para otros UIDs
          chmod -R a+rwX "$XBPS_CACHE_DIR"

      - name: Generate checksums
        if: success()
        run: |
          ISO_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.iso" | head -n 1)
          echo "ISO=$ISO_FILE" >> "$GITHUB_ENV"
          (cd "$(dirname "$ISO_FILE")" && sha256sum "$(basename "$ISO_FILE")" > "$(basename "$ISO_FILE")-sha256.txt")
          cat "$(dirname "$ISO_FILE")/$(basename "$ISO_FILE")-sha256.txt"

      - name: Collect failure evidence
        if: failure()
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE/.cache" 2>/dev/null || true
          chmod -R a+rX "$GITHUB_WORKSPACE/live-maker"/mklive-build.* 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/live-maker"/mklive-build.*/void-target/var/db/xbps/keys/ 2>/dev/null || true
          sha256sum "$GITHUB_WORKSPACE/.cache"/xbps/*/*.xbps "$GITHUB_WORKSPACE/.cache"/xbps/*/*.sig2 2>/dev/null || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: |
            ${{ github.workspace }}/.cache/xbps/
            ${{ github.workspace }}/live-maker/mklive-build.*/void-target/var/db/xbps/keys/
            ${{ github.workspace }}/live-maker/mklive-build.*/void-target/var/db/xbps/https___*/

      - name: Publish MUSL release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: musl
          name: Neko Void MUSL
          files: |
            ${{ env.ISO }}
            ${{ env.ISO }}-sha256.txt
