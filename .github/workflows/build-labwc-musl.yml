name: Neko Void - LabWC MUSL

on:
  workflow_dispatch:
    inputs:
      bootloader:
        description: 'Bootloader de la ISO (grub = GRUB+isolinux, limine = Limine BIOS+UEFI)'
        type: choice
        options:
          - grub
          - limine
        default: grub

permissions:
  contents: write

concurrency:
  group: neko-labwc-musl-${{ github.ref }}
  cancel-in-progress: true

env:
  XBPS_CACHE_DIR: ${{ github.workspace }}/.cache/xbps

jobs:
  build-labwc-musl:
    name: Build LabWC MUSL ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ponytail: la cache guarda .xbps descargados; xbps solo baja lo nuevo/actualizado
      - name: Restore xbps cache
        uses: actions/cache@v4
        with:
          path: ${{ env.XBPS_CACHE_DIR }}
          key: xbps-labwc-musl-${{ hashFiles('live-maker/base-neko-pkgs.sh', 'live-maker/neko-builder.sh', 'live-maker/labwc-musl/**') }}
          restore-keys: xbps-labwc-musl-

      # ponytail: el build va en docker run y no en `container:` porque las
      # acciones JS del runner (checkout, cache) necesitan libstdc++ dentro
      # del contenedor, y la imagen de Void glibc no lo trae.
      - name: Build LabWC MUSL ISO
        run: |
          set -e
          mkdir -p "$XBPS_CACHE_DIR/target" "$XBPS_CACHE_DIR/host"
          # El cachedir por defecto vive junto al builder; se enlaza al workspace para que la cache persista
          ln -sfn "$XBPS_CACHE_DIR/target" live-maker/xbps-cachedir-x86_64-musl
          ln -sfn "$XBPS_CACHE_DIR/host" live-maker/xbps-cachedir-x86_64
          docker run --rm --privileged \
            -e BOOTLOADER="${{ inputs.bootloader }}" \
            -v /dev:/dev -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/live-maker \
            ghcr.io/void-linux/void-glibc:20261001R1 sh -c '
              set -e
              export LANG=C.UTF-8
              xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/
              xbps-install -y --repository=https://repo-de.voidlinux.org/current/ bash coreutils sed tar gzip xz zstd gawk grep findutils diffutils util-linux e2fsprogs dosfstools kmod squashfs-tools shadow git sudo curl wget file python3
              groupadd -g 1000 anon || true
              useradd -m -u 1000 -g anon -s /bin/bash anon || true
              echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon
              mkdir -p /var/db/xbps/keys
              curl -sL https://srdicov.github.io/z-repo/keys/zlinux-repo.pub -o /var/db/xbps/keys/zlinux-repo.pub
              chmod 644 /var/db/xbps/keys/zlinux-repo.pub
              cd /workspace/live-maker
              mkdir -p labwc/etc/pam.d
              printf "#%%PAM-1.0\nauth required pam_env.so\nauth required pam_permit.so\naccount include system-login\npassword include system-login\nsession include system-login\n" > labwc/etc/pam.d/lightdm-autologin
              chmod 644 labwc/etc/pam.d/lightdm-autologin
              chown -R anon:anon /workspace
              chmod 755 ./labwc/home/anon
              rm -f ./labwc/home/anon/.Xauthority ./labwc/home/anon/.ICEauthority
              su anon -c "cd /workspace/live-maker && bash neko-builder.sh labwc-musl -b $BOOTLOADER"
            '
          # La cache la guarda el runner; necesita lectura para otros UIDs
          chmod -R a+rwX "$XBPS_CACHE_DIR"

      - name: Generate checksums
        if: success()
        run: |
          ISO_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.iso" | head -n 1)
          echo "ISO=$ISO_FILE" >> "$GITHUB_ENV"
          (cd "$(dirname "$ISO_FILE")" && sha256sum "$(basename "$ISO_FILE")" > "$(basename "$ISO_FILE")-sha256.txt")
          cat "$(dirname "$ISO_FILE")"/$(basename "$ISO_FILE")-sha256.txt

      - name: Collect failure evidence
        if: failure()
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE/.cache" 2>/dev/null || true
          sha256sum "$GITHUB_WORKSPACE/.cache"/xbps/*/*.xbps "$GITHUB_WORKSPACE/.cache"/xbps/*/*.sig2 2>/dev/null || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: ${{ github.workspace }}/.cache/xbps/

      - name: Split ISO for release
        if: success()
        run: |
          # GitHub no acepta assets >=2GB: se publica partida
          split -b 1900M "$ISO" "$ISO-part-"
          sha256sum "$ISO-part-"* > "$ISO-sha256.txt"
          cat "$ISO-sha256.txt"

      - name: Publish MUSL release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.bootloader == 'limine' && 'musl-limine' || 'musl' }}
          name: Neko Void MUSL (${{ inputs.bootloader }})
          body: |
            ISO partida en trozos de 1900M. Para recomponer:
            `cat $(basename ${{ env.ISO }})-part-* > $(basename ${{ env.ISO }})`
            Verificar con `sha256sum -c`.
          files: |
            ${{ env.ISO }}-part-*
            ${{ env.ISO }}-sha256.txt
