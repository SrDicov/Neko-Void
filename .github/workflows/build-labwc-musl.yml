name: Neko Void - LabWC MUSL

on:
  workflow_dispatch:
    inputs:
      bootloader:
        description: 'Bootloader de la ISO (grub = GRUB+isolinux, limine = Limine BIOS+UEFI)'
        type: choice
        options:
          - grub
          - limine
        default: grub

permissions:
  contents: write

concurrency:
  group: neko-labwc-musl-${{ github.ref }}
  cancel-in-progress: true

env:
  XBPS_CACHE_DIR: ${{ github.workspace }}/.cache/xbps

jobs:
  build-labwc-musl:
    name: Build LabWC MUSL ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ponytail: la cache guarda .xbps descargados; xbps solo baja lo nuevo/actualizado.
      # La clave NO lleva hashFiles: si cambia la lista de paquetes, una clave
      # nueva invalida 1.8 GB de cache y obliga a volver a descargarlo todo.
      # Con clave estable, xbps reutiliza lo que ya hay y solo baja lo que cambia.
      - name: Restore xbps cache
        uses: actions/cache@v4
        with:
          path: ${{ env.XBPS_CACHE_DIR }}
          key: xbps-labwc-musl-v2
          restore-keys: xbps-labwc-musl-

      # ponytail: el build va en docker run y no en `container:` porque las
      # acciones JS del runner (checkout, cache) necesitan libstdc++ dentro
      # del contenedor, y la imagen de Void glibc no lo trae.
      - name: Check coherence
        run: sh tools/check-coherence.sh

      # El script del contenedor debe ser shell valido y no debe usar la forma
      # fragile con comillas simples (que trunca el script en silencio).
      - name: Check workflows
        run: sh tools/check-workflows.sh

      - name: Build LabWC MUSL ISO
        run: |
          set -e
          mkdir -p "$XBPS_CACHE_DIR/target" "$XBPS_CACHE_DIR/host"
          # ponytail: el build va en docker run y no en `container:` porque las
          # acciones JS del runner (checkout, cache) necesitan libstdc++ dentro
          # del contenedor, y la imagen de Void glibc no lo trae.
          docker run --rm --privileged --cap-add=FOWNER \
            -e BOOTLOADER="${{ inputs.bootloader }}" \
            -v /dev:/dev -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/live-maker \
            ghcr.io/void-linux/void-glibc:20261001R1 sh -s <<'EOS'
              set -e
              export LANG=C.UTF-8
              # El cachedir del target vive en el workspace para que la cache
              # persista; el del host usa el suyo propio pero tambien se
              # guarda. Los .xbps llevan la arch en el nombre, asi que ambos
              # target y host comparten cache sin colisionar.
              # El indice cacheado de un repo puede quedarse viejo (xbps no lo
              # resincroniza si el servidor responde 'not modified') y entonces
              # un paquete que ya existe sale como "Package 'jq' not found in
              # repository pool". Los .xbps (lo pesado, 1,8 GB) se conservan;
              # solo se borran los indices, que son unos MB.
              find /workspace/.cache/xbps -name '*repodata*' -delete 2>/dev/null || true
              ln -sfn /workspace/.cache/xbps/target xbps-cachedir-x86_64-musl
              ln -sfn /workspace/.cache/xbps/host xbps-cachedir-x86_64
              xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/
              xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ bash coreutils sed tar gzip xz zstd gawk grep findutils diffutils util-linux e2fsprogs dosfstools kmod squashfs-tools shadow git sudo curl wget file python3
              groupadd -g 1000 anon || true
              useradd -m -u 1000 -g anon -s /bin/bash anon || true
              echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon
              mkdir -p /var/db/xbps/keys
              curl -sL https://srdicov.github.io/z-repo/keys/zlinux-repo.pub -o /var/db/xbps/keys/zlinux-repo.pub
              chmod 644 /var/db/xbps/keys/zlinux-repo.pub
              cd /workspace/live-maker
              # Autologin: fuente unica (live-maker/autologin). Si el overlay
              # trae su propia variante, esa gana.
              OV=$(sh flavor.sh labwc-musl overlay)
              mkdir -p "$OV/etc/pam.d"
              [ -f "$OV/etc/pam.d/lightdm-autologin" ] ||
                cp autologin/etc/pam.d/lightdm-autologin "$OV/etc/pam.d/"
              # El cache se deja en manos de root: si no, xbps no puede cambiar
              # los permisos de los .xbps que hay ahi.
              chown -R anon:anon /workspace/live-maker
              chmod 755 ./labwc/home/anon
              rm -f ./labwc/home/anon/.Xauthority ./labwc/home/anon/.ICEauthority
              # ponytail: los mirrors de Void se reindexan cada ~20 min y hay
              # una ventana en la que el indice y los ficheros no cuadran
              # ("Package 'jq' not found in repository pool"). Es
              # infraestructura, no el build: reintenta.
              for attempt in 1 2 3; do
                if su anon -c "cd /workspace/live-maker && bash neko-builder.sh labwc-musl -b $BOOTLOADER"; then
                  break
                fi
                echo ">>> el build fallo (intento $attempt/3); reintento en 30 s" >&2
                [ "$attempt" -lt 3 ] || exit 1
                sleep 30
              done
              # El ISO lo crea root; el runner (otro uid) tiene que poder escribir
              # ahi los checksums y los trozos del split.
              chmod 777 /workspace/live-maker
              chmod 644 /workspace/live-maker/*.iso /workspace/live-maker/*.txt 2>/dev/null || true
          EOS
          # La cache la guarda el runner; los .xbps son de root (los creo el
          # container), asi que el runner no puede cambiarles los permisos.
          chmod -R a+rwX "$XBPS_CACHE_DIR" 2>/dev/null || true

      - name: Generate checksums
        if: success()
        run: |
          ISO_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -name "*.iso" | head -n 1)
          echo "ISO=$ISO_FILE" >> "$GITHUB_ENV"
          (cd "$(dirname "$ISO_FILE")" && sha256sum "$(basename "$ISO_FILE")" > "$(basename "$ISO_FILE")-sha256.txt")
          cat "$(dirname "$ISO_FILE")"/$(basename "$ISO_FILE")-sha256.txt

      - name: Collect failure evidence
        if: failure()
        run: |
          chmod -R a+rX "$GITHUB_WORKSPACE/.cache" 2>/dev/null || true
          sha256sum "$GITHUB_WORKSPACE/.cache"/xbps/*/*.xbps "$GITHUB_WORKSPACE/.cache"/xbps/*/*.sig2 2>/dev/null || true

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-evidence
          path: ${{ github.workspace }}/.cache/xbps/

      - name: Split ISO for release
        if: success()
        run: |
          # GitHub no acepta assets >=2GB: se publica partida
          split -b 1900M "$ISO" "$ISO-part-"
          (cd "$(dirname "$ISO")" && sha256sum "$(basename "$ISO")"-part-* > "$(basename "$ISO")"-sha256.txt)
          cat "$ISO-sha256.txt"

      - name: Publish MUSL release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.bootloader == 'limine' && 'musl-limine' || 'musl' }}
          name: Neko Void MUSL (${{ inputs.bootloader }})
          body: |
            ISO partida en trozos de 1900M. Para recomponer:
            `cat $(basename ${{ env.ISO }})-part-* > $(basename ${{ env.ISO }})`
            Verificar con `sha256sum -c`.
          files: |
            ${{ env.ISO }}-part-*
            ${{ env.ISO }}-sha256.txt
