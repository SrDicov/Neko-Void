name: Debug xbps musl (temporal)
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    container:
      image: 'ghcr.io/void-linux/void-mklive:20250116R1'
      options: --privileged
      volumes:
        - /dev:/dev
      env:
        PATH: '/usr/bin:/bin:/usr/sbin:/sbin:/usr/local/sbin:/usr/local/bin:/tmp/bin'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare
        shell: sh
        run: |
          xbps-install -Syu --repository=https://repo-de.voidlinux.org/current/ xbps
          xbps-install -yu --repository=https://repo-de.voidlinux.org/current/
          xbps-install -y --repository=https://repo-de.voidlinux.org/current/ git bash wget curl file sudo
          groupadd -g 1000 anon || true
          useradd -m -u 1000 -g anon -s /bin/bash anon || true
          echo "anon ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/anon
          mkdir -p /var/db/xbps/keys
          curl -sL https://srdicov.github.io/z-repo/keys/zlinux-repo.pub -o /var/db/xbps/keys/zlinux-repo.pub
      - name: mklive directo con trace
        run: |
          cd "$GITHUB_WORKSPACE/live-maker"
          . ./base-neko-pkgs.sh
          chown -R anon:anon ./labwc/home/anon || true
          bash -x ./mklive.sh -a x86_64-musl -I ./labwc -I ./labwc-musl -o /tmp/trace-test.iso -T NekoVoid -p "$PACKAGES_MUSL_LABWC" -v linux-mainline -S "dbus NetworkManager emptty" -r https://repo-ci.voidlinux.org/current/musl -r https://repo-ci.voidlinux.org/current/musl/nonfree -r https://github.com/SrDicov/z-repo-musl/releases/download/stable -r https://sourceforge.net/projects/neko-void/files/repo/musl -i xz -s zstd -L 22 -K > $GITHUB_WORKSPACE/mktrace.log 2>&1 || true
          grep -nE 'XBPS_ARCH=|copy_void_keys|CACHEDIR=|VOIDTARGETDIR=|REPOSITORY=\(|TARGET_ARCH=' $GITHUB_WORKSPACE/mktrace.log | head -20 || true
          echo "--- xbps-install invocacion:"; grep -n 'xbps-install -r' $GITHUB_WORKSPACE/mktrace.log | head -5 || true
          echo "--- builddir:"; ls -d "$GITHUB_WORKSPACE"/live-maker/mklive-build.* 2>/dev/null || true
          echo FIN-TRACE
      - name: Subir trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mktrace
          path: $GITHUB_WORKSPACE/mktrace.log
